name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Verify committed bundle
        run: git diff --exit-code -- dist

  pinned:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
          - runner: macos-15-intel
          - runner: macos-14
          - runner: windows-latest
          - runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Sprocket
        id: sprocket
        uses: ./
        with:
          version: 0.27.0
          github-token: ${{ github.token }}
      - name: Verify installed version
        env:
          INSTALLED_VERSION: ${{ steps.sprocket.outputs.installed-version }}
        shell: bash
        run: |
          sprocket --version
          test "$INSTALLED_VERSION" = "v0.27.0"

  latest:
    strategy:
      fail-fast: false
      matrix:
        # This runner list must mirror the platform assets that Sprocket's
        # latest stable release publishes. Update the matrix whenever the
        # upstream asset set changes.
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install latest Sprocket
        uses: ./
        with:
          version: latest
          github-token: ${{ github.token }}
      - run: sprocket --version

  missing-asset:
    # Positive-control leg: v0.28.0 omitted macOS Intel assets, so this job is
    # expected to fail. tests/release.test.ts asserts the exact error text that
    # selectAsset emits when the platform asset is absent.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Attempt release that omits macOS Intel
        id: install
        continue-on-error: true
        uses: ./
        with:
          version: 0.28.0
          github-token: ${{ github.token }}
      - name: Require the expected failure
        env:
          OUTCOME: ${{ steps.install.outcome }}
        run: test "$OUTCOME" = "failure"

  branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Sprocket from its default branch
        id: sprocket
        uses: ./
        with:
          branch: main
          github-token: ${{ github.token }}
      - name: Verify branch installation
        env:
          INSTALLED_VERSION: ${{ steps.sprocket.outputs.installed-version }}
        run: |
          sprocket --version
          test -n "$INSTALLED_VERSION"
