name: Release setup-sprocket

on:
  workflow_dispatch:
    inputs:
      version:
        description: New action version, such as v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a version such as v1.0.0" >&2
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run all
      - name: Verify committed bundle
        run: git diff --exit-code -- dist
      - name: Create immutable semantic release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run:
          gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes
      - name: Update moving major tag
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "$MAJOR" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR"
