name: Setup Sprocket
description: Install a Sprocket release or branch build and add it to PATH
author: St. Jude Rust Labs

inputs:
  version:
    description:
      Exact Sprocket version, with or without a leading v, or latest; mutually
      exclusive with branch
    required: false
  branch:
    description:
      Sprocket branch to build from source; mutually exclusive with version
    required: false
  github-token:
    description: GitHub token used to query release metadata
    required: false

outputs:
  installed-version:
    description: Normalized Sprocket version that was installed

runs:
  using: node24
  main: dist/index.js

branding:
  icon: settings
  color: blue
